# One Render web service running both processes side by side: Next.js on the
# public $PORT Render assigns, and the Express API on a fixed loopback-only
# port set via INTERNAL_API_PORT (deliberately a different name than $PORT, so
# Express's real bind port can never be confused with the one Render assigns —
# see package.json's start:server, server/src/config/env.ts, and
# web/next.config.ts's rewrite). Details: server/README.md §9.
services:
  - type: web
    name: nerdshipping
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate --workspace=server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_STAFF_EMAIL
        sync: false
      - key: SEED_STAFF_PASSWORD
        sync: false
